<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>abbs树分析工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        /* 父容器设置为垂直方向flex布局 */
        .parent-container {
            display: flex;
            flex-direction: row;
            gap: 15px; /* 控制行间距 */
        }
        /* 保持每个.row内部横向排列 */
        .row {
            margin-bottom: 15px;
            min-width: 400px;
        }
        .row input{
            width: 150px;
        }
        .tree, .tree ul {
            list-style-type: none;
            padding-left: 20px;
        }
        .tree li {
            margin: 5px 0;
        }
        .pkgdep{
            background-color: lightgreen;
        }
        .builddep{
            background-color: lightgray;
        }
        .match {
            background-color: #ffffcc;
        }
        .greylight{
            background-color: #e0e0e0;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .smallfont{
            margin-top: 8px;
            margin-bottom: 3px;
            font-size: 12px;
            color: #808080;
        }
        .normalfont{
            font-size: 14px;
            color: #303030;
        }
        .tree ul {
            border-left: 1px dashed #3498db; /* 关键规则 */
        }
    </style>
</head>
<body>
    <div style="display:inline-block; width: 95%; margin-right: 10px; max-width: 1000px;">
        <div class="smallfont">
            1、选择<span class="greylight">abbs-anan</span>生成的<span class="greylight">json</span>文件
        </div>
        <span>
            <input type="text" id="filePath" placeholder="未选择文件" readonly style="width: 75%; margin-right: 10px;">
            <input type="file" id="fileLoader" accept=".json" style="display: none;">
            <button onclick="document.getElementById('fileLoader').click()">加载</button>
        </span>
        <div class="smallfont">
            2、依赖路径中必须含有的包，空格分组，过滤不关心的依赖，为空时会导致结果很多
        </div>
        <span>
            <textarea id="includeText" style="width: 75%;height: 30px;"></textarea>
        </span>
        <div class="smallfont">
            3、需要高亮的单词，某些时候很有用
        </div>
        <div>
            <textarea id="lightText" style="width: 75%;height: 40px;"></textarea>
        </div>
        <div>
            <span class="normalfont">最大分析层级</span>
            <input type="text" id="maxLevelText" style="width: 30px; margin-right: 10px;" value="8">
            <span>
                <input type="checkbox" id="useSelfCheck" checked>
                <span class="normalfont">显示自引用</span>
            </span>
        </div>
        <div class="smallfont">
            4、输入需要分析的包名
        </div>
        <span>
            <input type="text" id="searchText" placeholder="输入搜索关键词" style="width: 75%; margin-right: 10px;">
            <button onclick="analyzeJson()" style="margin-right: auto;">分析</button>
        </span>
    </div>
    <div class="row">
        <div id="treeContainer"></div>
    </div>

    <script>
        let jsonData = null;
        
        document.getElementById('fileLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('filePath').value = file.name;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        jsonData = JSON.parse(e.target.result);
                    } catch (error) {
                        alert('JSON格式错误: ' + error.message);
                        jsonData = null;
                    }
                };
                reader.readAsText(file);
            }
        });

        function analyzeJson() {
            if (!jsonData) {
                alert('请先加载JSON文件');
                return;
            }
            
            const searchTerm = document.getElementById('searchText').value.trim();
            if (!searchTerm) {
                alert('请输入搜索关键词');
                return;
            }

            //生成指定层级的json树  
            let newJson = filterJson(jsonData, searchTerm);
            console.log(newJson);
            //return;

            const container = document.getElementById('treeContainer');
            container.innerHTML = '';
            
            //const rootUl = document.createElement('ul');
            //rootUl.className = 'tree';
            //container.appendChild(rootUl);
            
            //重建为树形结构，同时匹配高亮、自引用、已在前面出现过的包
            buildTree(container, newJson, searchTerm);
        }

        //原始json，需要查找的包名，当前层级，最大层级
        //返回的是字典，为空时返回null
        function filterJson(jsonData, pkgName){
            //最大允许的层级
            const maxLevel = parseInt(document.getElementById('maxLevelText').value.trim());
            //生成keyPackages列表
            let keyPackages = create_text_area_list("includeText")
            //检查是否需要自包含
            const isShowSelf = document.getElementById('useSelfCheck').checked
            if(Object.keys(keyPackages).length > 0){
                //自包含是否被选中
                if(isShowSelf) keyPackages.push(pkgName);
            }else{
                keyPackages = null;
            }
            //=============== 用于递归的函数 ==================
            function filterJson_t(thisName, level){
                //后一个参数是本条分支是否应该保留，如果用于过滤的包为空，那么所有的分支都应该保留
                let result = [{"PKGNAME": thisName}, keyPackages === null]
                //先确定本分支是否应该保留
                //if(thisName === "libtiff"){
                //    let uuuu = 0;
                //}
                if(keyPackages && keyPackages.includes(thisName)){
                    result[1] = true ;
                } 
                if(!(thisName in jsonData)){
                    (result[0])["PKGNAME"] = thisName + " 没有找到";
                    return result;
                }
                if(level > maxLevel){
                    return result;
                }
                //进入正常判断流程
                let vals = jsonData[thisName]
                for (const key of ["PKGDEP", "BUILDDEP"]){
                    if(!(key in vals)) continue;
                    let outlst = []
                    for(const cc of vals[key]){
                        console.log(cc)
                        //自包含就没有必要进入下一层了
                        if(cc === pkgName) {
                            let subret = filterJson_t(cc, maxLevel + 1);
                            outlst.push(subret[0]);
                            //勾选了必须自包含时
                            if(isShowSelf) result[1] = true;
                        }
                        else{
                            //总是立即进入下一层，这样我们才能知道本条分支是否应该保留
                            //关键依赖包判断意见在函数的开头做了
                            let subret = filterJson_t(cc, level + 1);
                            if(subret[1] === true){
                                outlst.push(subret[0]);
                                result[1] = true;
                            }
                        }
                    }
                    (result[0])[key] = outlst;
                }
                //console.log([thisName, level])
                return result;
            }
            //=====================================
            let baseRet = filterJson_t(pkgName, 0);
            return baseRet[0];
        }

        function buildTree(parent, jsonData, searchTerm, path = []) {
            if (jsonData === null || typeof jsonData === 'undefined'){
                console.log("提供了非json数据")
                return;
            }
            ///
            function create_ul_from_json(thisJson, level){
                const ul = document.createElement('ul');
                ul.textContent = thisJson["PKGNAME"]
                if(level === 1 ) ul.className = "tree";
                for (const key of ["PKGDEP", "BUILDDEP"]){
                    if(!(key in thisJson)) continue;
                    let isbuild = (key === "BUILDDEP")
                    for(const child of thisJson[key]){
                        childul = create_ul_from_json(child, level + 1)
                        if(isbuild) childul.className = "builddep"
                        ul.appendChild(childul)
                    }
                }
                return ul
            }

            const baseul = create_ul_from_json(jsonData, 0)
            parent.appendChild(baseul);
        }

        //获取keypackages
        function create_text_area_list(textIdName){
            tstr = document.getElementById(textIdName).value.trim();
            tstr = tstr.replace(/\r|\n|\\/g, ' ');
            //console.log(tstr)
            const result = tstr.split(' ').filter(item => item !== '');
            //console.log(result)
            return result
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
    </script>
</body>
</html>
